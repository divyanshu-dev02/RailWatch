spring.application.name=railwaycongestion
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/railway_congestion?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.flyway.enabled=${FLYWAY_ENABLED:true}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
spring.mvc.async.request-timeout=0
server.error.include-message=never
server.error.include-stacktrace=never
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
railwatch.demo.enabled=${DEMO_ENABLED:false}
railwatch.demo.interval-ms=${DEMO_INTERVAL_MS:15000}
