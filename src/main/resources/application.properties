spring.application.name=railwaycongestion

# Database Configuration with Environment Variable overrides (for local MySQL, Docker, and Cloud MySQL like Aiven)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/railway_congestion?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234Divyanshu}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate & JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server Port
server.port=${PORT:8084}
