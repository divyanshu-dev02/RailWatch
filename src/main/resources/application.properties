spring.application.name=railwaycongestion
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/railway_congestion?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.flyway.enabled=${FLYWAY_ENABLED:true}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
spring.mvc.async.request-timeout=0
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
railwatch.demo.interval-ms=${DEMO_INTERVAL_MS:15000}
